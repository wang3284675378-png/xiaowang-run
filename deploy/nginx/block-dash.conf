server {
    listen 80;
    listen [::]:80;

    # Replace this with the domain that points to the Hong Kong server.
    server_name game.example.com;

    # Upload the contents of the local outputs folder to this directory.
    root /var/www/block-dash;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/block-dash.access.log;
    error_log  /var/log/nginx/block-dash.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
